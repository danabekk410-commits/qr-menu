<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c1814">
<title>Honey Coffee — меню (демо)</title>
<meta name="description" content="Демо QR-меню для кафе и ресторанов: категории, поиск, фото блюд, заказ официанту, три языка.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f0e8; --card:#fffdf9; --ink:#1f1a15; --muted:#6f655a; --line:#e6ddd0;
  --accent:#b5502a; --accent-ink:#fff; --accent-soft:#f3e2d6; --dark:#1c1814;
  --hit:#b5502a; --spicy:#c0392b; --veg:#3f7a4a;
  --r:18px; --shadow:0 6px 24px rgba(40,28,15,.08);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
img{display:block;max-width:100%}
.wrap{max-width:560px;margin:0 auto;position:relative}
h1,h2,h3{margin:0}
.serif{font-family:"Playfair Display",Georgia,serif}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* Шапка */
.hero{position:relative;height:250px;overflow:hidden;background:var(--dark)}
.hero img{width:100%;height:100%;object-fit:cover;opacity:.85}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,15,10,.35) 0%,rgba(20,15,10,.05) 40%,rgba(20,15,10,.85) 100%)}
.topbar{position:absolute;z-index:2;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center}
.demo-tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);padding:5px 10px;border-radius:99px}
.langs{display:flex;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);border-radius:99px;padding:3px}
.langs button{color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;opacity:.75}
.langs button[aria-pressed="true"]{background:#fff;color:var(--ink);opacity:1}
.brand{position:absolute;z-index:2;left:16px;right:16px;bottom:18px;display:flex;gap:14px;align-items:flex-end;color:#fff}
.logo{flex:none;width:64px;height:64px;border-radius:18px;background:var(--bg);color:var(--accent);display:grid;place-items:center;font:700 26px "Playfair Display",serif;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.brand h1{font:700 28px/1.1 "Playfair Display",serif}
.brand p{margin:4px 0 0;font-size:13px;opacity:.9}
.open{display:inline-flex;align-items:center;gap:6px}
.open::before{content:"";width:7px;height:7px;border-radius:50%;background:#6fd08c}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px 4px}
.quick button,.quick a{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ink);text-decoration:none}
.quick svg{width:20px;height:20px;stroke:var(--accent)}

.promo{margin:12px 16px 0;border-radius:var(--r);background:var(--dark);color:#f5efe6;padding:14px 16px;display:flex;gap:12px;align-items:center}
.promo b{display:block;font-size:15px}
.promo span{font-size:13px;opacity:.8}
.promo .pct{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff}

/* Липкая навигация */
.nav{position:sticky;top:0;z-index:20;background:rgba(245,240,232,.94);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
.nav.stuck{border-color:var(--line)}
.nav-row{display:flex;gap:8px;padding:10px 16px 0;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px}
.search svg{width:18px;height:18px;flex:none;stroke:var(--muted)}
.search input{flex:1;border:0;outline:0;background:transparent;font:inherit;color:var(--ink);min-width:0}
.icon-btn{width:42px;height:42px;flex:none;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px;stroke:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.filters{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{flex:none;padding:6px 11px;border-radius:99px;border:1px dashed #cdbfae;font-size:12px;font-weight:600;color:var(--muted)}
.filter[aria-pressed="true"]{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* Разделы и карточки */
main{padding:4px 16px 140px}
.section{scroll-margin-top:156px;padding-top:18px}
.section h2{font:700 22px "Playfair Display",serif;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dish{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;position:relative;width:100%}
.dish .ph{aspect-ratio:1;background:#e9dfd2;position:relative;overflow:hidden}
.dish .ph img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.dish:active .ph img{transform:scale(1.03)}
.badges{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:#fff;padding:3px 7px;border-radius:99px;background:var(--hit)}
.badge.spicy{background:var(--spicy)}.badge.veg{background:var(--veg)}
.dish .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.dish .name{font-weight:700;font-size:14px;line-height:1.25}
.dish .meta{font-size:12px;color:var(--muted)}
.dish .row{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center}
.price{font-weight:800;font-size:15px;white-space:nowrap}
.add{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:20px;line-height:1;flex:none}
.add.has{width:auto;padding:0 10px;border-radius:99px;font-size:13px;font-weight:800}
/* Список */
.list .grid{grid-template-columns:1fr}
.list .dish{flex-direction:row;min-height:112px}
.list .dish .ph{width:112px;flex:none;aspect-ratio:auto}
.list .badges{display:none}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

footer{margin:30px 0 0;padding:22px 16px;border-radius:var(--r);background:var(--dark);color:#efe7dc;text-align:center}
footer p{margin:0 0 12px;font-size:13px;opacity:.8}
footer a{display:inline-block;background:#25d366;color:#08331a;font-weight:800;padding:12px 18px;border-radius:12px;text-decoration:none}

/* Панель заказа */
.cartbar{position:fixed;z-index:30;left:0;right:0;bottom:0;padding:10px 16px calc(12px + var(--safe-b));pointer-events:none;transform:translateY(120%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.cartbar.show{transform:none}
.cartbar button{pointer-events:auto;max-width:528px;margin:0 auto;width:100%;background:var(--ink);color:#fff;border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:700}
.cartbar .count{background:var(--accent);border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;font-size:13px}
.cartbar .sum{margin-left:auto}
.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.04)}}

/* Шторки */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,14,8,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;max-height:92vh;max-height:92dvh;overflow-y:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(16px + var(--safe-b))}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:#cdbfae;margin:8px auto}
.close{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;z-index:2;font-size:20px}
.sheet .big{aspect-ratio:4/3;background:#e9dfd2}
.sheet .big img{width:100%;height:100%;object-fit:cover}
.sheet .pad{padding:16px}
.sheet h3{font:700 24px/1.15 "Playfair Display",serif}
.sheet .desc{color:var(--muted);margin:8px 0 0}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.facts span{font-size:12px;background:var(--card);border:1px solid var(--line);padding:5px 9px;border-radius:99px}
.opt{margin-top:16px}
.opt h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:9px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.buy{display:flex;gap:10px;margin-top:18px;align-items:center}
.qty{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px}
.qty button{width:44px;height:48px;font-size:22px}
.qty output{min-width:26px;text-align:center;font-weight:800}
.primary{flex:1;background:var(--accent);color:#fff;border-radius:14px;height:50px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.secondary{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;height:50px;font-weight:700;display:flex;align-items:center;justify-content:center}

.cart-head{display:flex;justify-content:space-between;align-items:baseline;padding:4px 16px 8px}
.cart-head h3{font-size:24px}
.cart-head button{color:var(--muted);font-size:13px;text-decoration:underline}
.line{display:flex;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.line img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none}
.line .t{flex:1;min-width:0}
.line .t b{display:block;font-size:14px}
.line .t small{color:var(--muted)}
.line .qty button{width:34px;height:36px;font-size:18px}
.totals{padding:12px 16px;border-top:1px solid var(--line)}
.totals div{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:2px 0}
.totals .grand{color:var(--ink);font-weight:800;font-size:18px;padding-top:6px}
.cart-actions{display:flex;flex-direction:column;gap:8px;padding:6px 16px 0}
.cart-actions .primary,.cart-actions .secondary{flex:none;width:100%}
.note{font-size:12px;color:var(--muted);text-align:center;margin:10px 16px 0}

/* Экран для официанта */
.waiter{position:fixed;inset:0;z-index:60;background:#fff;color:#000;overflow-y:auto;padding:22px 20px calc(24px + var(--safe-b));display:none}
.waiter.show{display:block}
.waiter .tbl{font:800 44px/1 Manrope,sans-serif}
.waiter .sub{color:#555;margin:6px 0 18px}
.waiter ol{list-style:none;margin:0;padding:0}
.waiter li{display:flex;gap:12px;font-size:22px;font-weight:700;padding:12px 0;border-bottom:2px solid #eee}
.waiter li .q{min-width:44px}
.waiter li small{display:block;font-size:15px;color:#555;font-weight:500}
.waiter .sumw{font-size:26px;font-weight:800;margin:16px 0 22px;text-align:right}

.toast{position:fixed;z-index:70;left:50%;top:16px;transform:translate(-50%,-150%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .3s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}

@media (min-width:600px){ .wrap{box-shadow:0 0 0 1px var(--line)} body{background:#ebe3d7} .wrap{background:var(--bg)} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important;scroll-behavior:auto!important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <img src="img/cover.jpg" alt="" width="1200" height="800" fetchpriority="high">
    <div class="topbar">
      <span class="demo-tag" data-i="demo">Демо меню</span>
      <div class="langs" role="group" aria-label="Язык">
        <button data-lang="ru" aria-pressed="true">RU</button>
        <button data-lang="kz" aria-pressed="false">KZ</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <div class="brand">
      <div class="logo" aria-hidden="true">H</div>
      <div>
        <h1>Honey Coffee</h1>
        <p><span class="open" data-i="open">Открыто до 21:00</span> · <span data-i="kitchen">Кофе, завтраки и десерты</span></p>
      </div>
    </div>
  </header>

  <div class="quick">
    <button id="waiterCall" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span data-i="call">Официант</span>
    </button>
    <button id="wifi" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><path d="M12 20h.01"/></svg>
      <span>Wi-Fi</span>
    </button>
    <button id="billBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      <span data-i="bill">Счёт</span>
    </button>
  </div>

  <div class="promo">
    <div class="pct">−50%</div>
    <div><b data-i="promoT">Завтраки весь день</b><span data-i="promoS">До 11:00 капучино к любому завтраку — за полцены</span></div>
  </div>

  <nav class="nav" id="nav" aria-label="Категории меню">
    <div class="nav-row">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" data-ph="search" placeholder="Найти блюдо" aria-label="Поиск по меню">
      </label>
      <button class="icon-btn" id="viewBtn" type="button" aria-label="Вид: плитка или список">
        <svg id="viewIco" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="filters" id="filters"></div>
  </nav>

  <main id="menu"></main>
</div>

<div class="cartbar" id="cartbar">
  <button type="button" id="openCart"><span class="count" id="cCount">0</span><span data-i="myOrder">Мой заказ</span><span class="sum" id="cSum">0 ₸</span></button>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="dishSheet" role="dialog" aria-modal="true" aria-labelledby="dTitle"></section>
<section class="sheet" id="cartSheet" role="dialog" aria-modal="true" aria-labelledby="cTitle"></section>
<section class="waiter" id="waiter" role="dialog" aria-modal="true" aria-label="Заказ для официанта"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

     var sc = JSON.parse(store("qm_cart")||"[]"); if(Array.isArray(sc)) cart = sc.filter(validLine); }catch(e){ cart = []; }

function validLine(l){
  if(!l || typeof l!=="object" || !byId[l.id]) return false;
  if(!(Number.isInteger(l.q) && l.q>0 && l.q<=99)) return false;
  var x = byId[l.id];
  if(x.opt) return Number.isInteger(l.o) && l.o>=0 && l.o<x.opt.v.length;
  return l.o==null;
}

      if(x.cat!==c.id) return false;

      if(q){ var hay = [x.n.ru,x.n.en,x.n.kz||"",x.d.ru,x.d.en].join(" ").toLowerCase(); if(hay.indexOf(q)<0) return false; }

/* Корзина */
function save(){ store("qm_cart", JSON.stringify(cart)); }
function lineKey(id,o){ return id + "|" + (o==null?"":o); }
function linePrice(l){ var x = byId[l.id]; var add = (x.opt && l.o!=null) ? x.opt.v[l.o].p : 0; return x.price + add; }
function subtotal(){ return cart.reduce(function(s,l){ return s + linePrice(l)*l.q; },0); }
function count(){ return cart.reduce(function(s,l){ return s + l.q; },0); }
function addToCart(id,o,q){
  var k = lineKey(id,o), f = cart.filter(function(l){ return lineKey(l.id,l.o)===k; })[0];
  if(f) f.q += q; else cart.push({id:id,o:o,q:q});
  save(); updateBar(true); renderMenu();
}
function updateBar(bump){
  var c = count(); $("#cCount").textContent = c; $("#cSum").textContent = money(subtotal());
  $("#cartbar").classList.toggle("show", c>0);
  if(bump){ var b = $("#openCart"); b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
}

var openSheet = null, lastFocus = null;

  lastFocus = document.activeElement;
  if(openSheet && openSheet!==el) openSheet.classList.remove("show");

  document.body.style.overflow = "hidden";
  var f = el.querySelector("button"); if(f) f.focus({preventScroll:true});
}
function hide(){
  if(openSheet) openSheet.classList.remove("show");
  openSheet = null; $("#scrim").classList.remove("show"); document.body.style.overflow = "";
  if(lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
}

/* Подсветка категории при прокрутке */
var spying = true;
function spy(){
  if(!spying) return;
  var secs = document.querySelectorAll(".section"), cur = null;
  secs.forEach(function(s){ if(s.getBoundingClientRect().top < 175) cur = s.id; });
  if(!cur && secs[0]) cur = secs[0].id;
  document.querySelectorAll(".chip").forEach(function(ch){
    var on = "s-"+ch.dataset.cat === cur;
    if(on && ch.getAttribute("aria-current")!=="true"){
      var box = $("#chips"); box.scrollTo({left: ch.offsetLeft - 16, behavior:"smooth"});
    }
    ch.setAttribute("aria-current", on);
  });
  $("#nav").classList.toggle("stuck", $("#nav").getBoundingClientRect().top <= 0);
}

});
$("#filters").addEventListener("click", function(e){
  var f = e.target.closest(".filter"); if(!f) return;
  filters[f.dataset.f] = !filters[f.dataset.f]; f.setAttribute("aria-pressed", filters[f.dataset.f]); renderMenu();
});
$("#q").addEventListener("input", renderMenu);
$("#menu").addEventListener("click", function(e){
  var qb = e.target.closest("[data-quick]");
  if(qb){ e.stopPropagation(); var x = byId[qb.dataset.quick]; if(x.opt) return openDish(x.id); addToCart(x.id,null,1); toast(t("added")); return; }
  var d = e.target.closest(".dish"); if(d) openDish(d.dataset.id);
});
$("#menu").addEventListener("keydown", function(e){
  if((e.key==="Enter"||e.key===" ") && e.target.classList.contains("dish")){ e.preventDefault(); openDish(e.target.dataset.id); }
});
$("#viewBtn").addEventListener("click", function(){
  view = view==="grid" ? "list" : "grid"; store("qm_view", view); setViewIcon(); renderMenu();
});
function setViewIcon(){
  $("#viewIco").innerHTML = view==="grid" ? '<path d="M4 6h16M4 12h16M4 18h16"/>' : '<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>';
}
document.querySelector(".langs").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  lang = b.dataset.lang; store("qm_lang", lang); applyStatic(); renderChips(); renderMenu();
});
$("#openCart").addEventListener("click", openCart);
$("#scrim").addEventListener("click", hide);
document.addEventListener("keydown", function(e){
  if(e.key!=="Escape") return;
  var w = $("#waiter"); if(w.classList.contains("show")){ w.querySelector("[data-back]").click(); return; }
  if(openSheet) hide();
});
$("#waiterCall").addEventListener("click", function(){ toast(t("calledToast")+TABLE); });
$("#billBtn").addEventListener("click", function(){ toast(t("billToast")+TABLE); });
$("#wifi").addEventListener("click", function(){
  try{ if(navigator.clipboard) navigator.clipboard.writeText("honey2026").catch(function(){}); }catch(e){}
  toast(t("wifiToast"));
});

applyStatic(); setViewIcon(); renderChips(); renderMenu(); updateBar();
})();
</script>
</body>
</html>
